
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;font-family:var(--font-sans)}
.outer{min-height:100vh;background:linear-gradient(160deg,#fff5e0 0%,#ffe8f0 40%,#e8f5ff 100%);position:relative;overflow-x:hidden}
.bubbles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0.18}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0.8)}100%{transform:translateY(-120px) scale(1.1)}}
.content{position:relative;z-index:1;padding:10px 10px 32px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

.banner-area{border-radius:18px;overflow:hidden;cursor:pointer;position:relative;min-height:76px}
.banner-inner{background:linear-gradient(135deg,#E24B4A 0%,#ff7043 50%,#E24B4A 100%);padding:14px 16px 12px;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent;position:relative}
.banner-inner::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='2' fill='white' opacity='0.15'/%3E%3C/svg%3E");border-radius:18px}
.banner-img{width:100%;display:block;object-fit:cover;max-height:120px;border-radius:18px}
.banner-ttl{font-size:clamp(16px,5vw,22px);font-weight:500;color:#fff;letter-spacing:0.05em;position:relative}
.banner-sub{font-size:clamp(10px,2.8vw,13px);color:rgba(255,255,255,0.82);margin-top:3px;position:relative}
.banner-edit-hint{position:absolute;bottom:6px;right:10px;font-size:10px;color:rgba(255,255,255,0.55);pointer-events:none}
.tap-note{font-size:10px;color:rgba(255,255,255,0.5);position:absolute;top:6px;right:10px}

.card{background:rgba(255,255,255,0.88);backdrop-filter:blur(8px);border-radius:16px;border:1.5px solid rgba(255,200,100,0.4);padding:10px 12px;box-shadow:0 2px 12px rgba(226,75,74,0.07)}
.card-title{font-size:11px;font-weight:500;color:#854F0B;margin-bottom:8px;letter-spacing:0.05em;text-transform:uppercase}

.remain-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.remain-item{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:10px;background:rgba(255,249,230,0.9);border:1px solid rgba(250,199,117,0.5)}
.rdot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,0.7)}
.rname{font-size:clamp(10px,2.5vw,12px);color:#3C2A00;flex:1;line-height:1.3}
.rnum{font-size:clamp(14px,3.5vw,17px);font-weight:500;color:#E24B4A}

.ticket-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ticket-row label{font-size:clamp(13px,3.5vw,15px);font-weight:500;color:#3C2A00}
.ticket-row input[type=number]{width:clamp(64px,17vw,80px);font-size:clamp(15px,4vw,17px);font-weight:500;padding:7px 8px;border:1.5px solid #FAC775;border-radius:10px;background:#fff;color:#3C2A00;text-align:center;-webkit-tap-highlight-color:transparent}
.ticket-badge{font-size:clamp(11px,3vw,13px);color:#854F0B;background:#FAEEDA;border-radius:20px;padding:4px 14px;border:1px solid rgba(250,199,117,0.5)}

.machine-section{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px 6px}
.machine-canvas{position:relative;width:clamp(220px,72vw,310px);height:clamp(220px,72vw,310px)}
.machine-canvas svg{width:100%;height:100%}

.ball-exit-container{position:relative;width:clamp(220px,72vw,310px);height:80px;overflow:visible;pointer-events:none}
.exit-ball-html{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;color:#fff;font-size:clamp(13px,3.5vw,16px);opacity:0;pointer-events:none;transition:none;box-shadow:0 4px 16px rgba(0,0,0,0.25)}

#spinBtn{font-size:clamp(15px,4.5vw,19px);font-weight:500;padding:clamp(12px,3.5vw,16px) clamp(36px,10vw,56px);border-radius:40px;border:none;background:linear-gradient(135deg,#E24B4A,#ff6b35);color:#fff;cursor:pointer;letter-spacing:0.06em;transition:transform .12s,opacity .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 4px 16px rgba(226,75,74,0.35)}
#spinBtn:disabled{opacity:.35;cursor:default;box-shadow:none}
#spinBtn:not(:disabled):active{transform:scale(.95)}
.result-badge{font-size:clamp(14px,4vw,17px);font-weight:500;padding:9px 22px;border-radius:40px;text-align:center;animation:pop .4s cubic-bezier(.2,1.4,.6,1) both;border:2px solid transparent}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sc{background:rgba(255,249,230,0.9);border-radius:10px;border:1px solid rgba(250,199,117,0.5);padding:8px 10px;text-align:center}
.sc-lbl{font-size:clamp(10px,2.5vw,11px);color:#854F0B;margin-bottom:3px;letter-spacing:0.03em}
.sc-val{font-size:clamp(17px,5vw,21px);font-weight:500;color:#3C2A00}
.sc-wide{grid-column:1/-1;background:rgba(255,249,230,0.9);border:1.5px solid #888780}
.sc-wide .sc-lbl{color:#5F5E5A}
.sc-wide .sc-val{font-size:clamp(19px,5.5vw,24px);color:#444441}

.log-card{background:rgba(255,255,255,0.88);backdrop-filter:blur(8px);border-radius:16px;border:1.5px solid rgba(255,200,100,0.4);padding:10px 12px}
.log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.log-header span{font-size:clamp(12px,3.2vw,14px);font-weight:500;color:#3C2A00}
.rbtn{font-size:clamp(11px,2.8vw,12px);color:#854F0B;background:#FAEEDA;border:1px solid rgba(250,199,117,0.6);border-radius:7px;padding:5px 13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rbtn:active{background:#FAC775}
.log-list{display:flex;flex-direction:column;gap:5px}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,249,230,0.9);border:1px solid rgba(250,199,117,0.4)}
.li-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,0.7)}
.li-name{font-size:clamp(12px,3.2vw,14px);color:#3C2A00;flex:1}
.li-qty{font-size:clamp(13px,3.5vw,15px);font-weight:500;color:#E24B4A;white-space:nowrap}
.li-pt{font-size:clamp(10px,2.5vw,12px);color:#888780;white-space:nowrap}
.empty{font-size:clamp(12px,3vw,13px);color:#BA7517;text-align:center;padding:14px 0}

.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-start;justify-content:center;padding:14px 10px;overflow-y:auto}
.overlay.open{display:flex}
.overlay-box{background:#fff;border-radius:20px;padding:16px;width:100%;max-width:460px;margin:auto}
.overlay-box h3{font-size:clamp(14px,4vw,16px);font-weight:500;color:#3C2A00;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.close-btn{font-size:clamp(11px,3vw,13px);color:#854F0B;background:#FAEEDA;border:none;border-radius:7px;padding:5px 14px;cursor:pointer}

.ps-row{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-bottom:.5px dashed #FAC775}
.ps-row:last-child{border-bottom:none}
.ps-top{display:flex;align-items:center;gap:7px}
.ps-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.ps-name{font-size:clamp(12px,3.2vw,13px);font-weight:500;color:#3C2A00;flex:1}
.ps-ctrls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ps-ctrls input[type=number]{width:clamp(55px,14vw,66px);font-size:13px;padding:4px 6px;border:1px solid #FAC775;border-radius:7px;background:#FFF9E6;color:#3C2A00;text-align:center}
.ps-ctrls input[type=range]{flex:1;min-width:90px;accent-color:#E24B4A}
.ps-pct{font-size:12px;font-weight:500;color:#E24B4A;min-width:42px;text-align:right}
.slbl{font-size:11px;color:#854F0B;white-space:nowrap}

.banner-settings{margin-top:14px;border-top:1px dashed #FAC775;padding-top:12px}
.banner-settings .bs-lbl{font-size:11px;color:#854F0B;margin-bottom:5px;font-weight:500}
.banner-settings input[type=text]{width:100%;font-size:13px;padding:7px 10px;border:1px solid #FAC775;border-radius:8px;background:#FFF9E6;color:#3C2A00;margin-bottom:6px}
.banner-settings input[type=file]{font-size:12px;color:#854F0B}
.bs-colors{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bs-color{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s}
.bs-color.active{border-color:#3C2A00;transform:scale(1.15)}

.win-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);padding:16px}
.win-overlay.open{display:flex}
.win-box{border-radius:24px;padding:clamp(20px,6vw,32px) clamp(16px,5vw,24px);text-align:center;animation:popbig .5s cubic-bezier(.2,1.4,.6,1) both;max-width:min(92vw,360px);width:100%;position:relative;overflow:hidden}
@keyframes popbig{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.win-title{font-size:clamp(20px,7vw,32px);font-weight:500;margin-bottom:6px;line-height:1.2}
.win-prize{font-size:clamp(15px,4.5vw,20px);font-weight:500;margin-bottom:8px}
.win-close{font-size:clamp(13px,3.5vw,15px);padding:11px 36px;border-radius:30px;border:none;cursor:pointer;margin-top:12px;font-weight:500;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cf-wrap{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;border-radius:24px}
.cf{position:absolute;border-radius:2px;animation:cffall linear forwards}
@keyframes cffall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(260px) rotate(720deg);opacity:0}}
</style>

<script>
const PRIZES=[
  {id:'p1',name:'1等：商品券3,000円',color:'#E24B4A',bg:'#FCEBEB',tc:'#A32D2D',cnt:10,prob:1,rank:1,pts:0},
  {id:'p2',name:'2等：お米 2kg',color:'#1D9E75',bg:'#E1F5EE',tc:'#085041',cnt:20,prob:2,rank:2,pts:0},
  {id:'p3',name:'3等：キッチンタオル4ロール',color:'#EF9F27',bg:'#FAEEDA',tc:'#633806',cnt:300,prob:25,rank:3,pts:0},
  {id:'p4',name:'4等：伊藤園むぎ茶650ml',color:'#378ADD',bg:'#E6F1FB',tc:'#0C447C',cnt:840,prob:55,rank:4,pts:0},
  {id:'p0',name:'参加賞：3ポイント',color:'#888780',bg:'#F1EFE8',tc:'#2C2C2A',cnt:99999,prob:17,rank:0,pts:3},
];
const BANNER_COLORS=['#E24B4A','#1D9E75','#378ADD','#EF9F27','#8B5CF6','#EC4899','#0F766E','#DC2626'];
let counts={},probs={},ticketLeft=0,spinCnt=0,totalPts=0,partCnt=0,tapCount=0,tapTimer=null,wonMap={};
let bannerColor='#E24B4A',bannerImgData=null;

function init(){
  PRIZES.forEach(p=>{counts[p.id]=p.cnt;probs[p.id]=p.prob});
  wonMap={};buildBubbles();syncTicket();renderRemain();renderStats();renderLog();
}

function buildBubbles(){
  const el=document.getElementById('bubblesEl');el.innerHTML='';
  const cols=['#FAC775','#F09595','#9FE1CB','#B5D4F4','#ED93B1','#C8F0FF','#FFE4A0'];
  for(let i=0;i<18;i++){
    const b=document.createElement('div');b.className='bubble';
    const sz=20+Math.random()*50;
    b.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:-60px;background:${cols[Math.floor(Math.random()*cols.length)]};animation-duration:${8+Math.random()*14}s;animation-delay:${Math.random()*10}s`;
    el.appendChild(b);
  }
}

function renderRemain(){
  const g=document.getElementById('remainGrid');g.innerHTML='';
  PRIZES.filter(p=>p.rank>0).forEach(p=>{
    const d=document.createElement('div');d.className='remain-item';
    d.innerHTML=`<span class="rdot" style="background:${p.color}"></span><span class="rname">${p.name}</span><span class="rnum" id="rn_${p.id}">${counts[p.id]}</span>`;
    g.appendChild(d);
  });
}
function updateRemainDisplay(){PRIZES.filter(p=>p.rank>0).forEach(p=>{const e=document.getElementById('rn_'+p.id);if(e)e.textContent=counts[p.id]})}

function syncTicket(){
  const v=parseInt(document.getElementById('ticketInput').value)||1;
  ticketLeft=v;
  document.getElementById('ticketBadge').textContent='残り '+ticketLeft+' 枚';
  document.getElementById('sTkt').textContent=ticketLeft;
  document.getElementById('spinBtn').disabled=ticketLeft<=0;
}

function renderStats(){
  const tp=PRIZES.filter(p=>p.rank>0).reduce((s,p)=>s+Math.max(0,counts[p.id]),0);
  document.getElementById('sPrz').textContent=tp;
  document.getElementById('sCnt').textContent=spinCnt;
  document.getElementById('sParticipate').textContent=partCnt;
  document.getElementById('sTotalPt').textContent=totalPts+' pt';
  document.getElementById('spinBtn').disabled=ticketLeft<=0;
}

function renderLog(){
  const el=document.getElementById('logList');
  const order=['p1','p2','p3','p4','p0'];
  const sorted=order.filter(id=>wonMap[id]);
  if(!sorted.length){el.innerHTML='<p class="empty">まだ抽選していません</p>';return}
  el.innerHTML=sorted.map(id=>{
    const e=wonMap[id],p=PRIZES.find(x=>x.id===id);
    return `<div class="li"><span class="li-dot" style="background:${p.color}"></span><span class="li-name">${p.name}</span><span class="li-qty">${e.qty}回</span>${id==='p0'?`<span class="li-pt">${totalPts}pt合計</span>`:''}</div>`;
  }).join('');
}

function pick(){
  const pool=PRIZES.filter(p=>p.rank===0||(counts[p.id]>0));
  const weights=pool.map(p=>Math.max(0,probs[p.id]));
  const total=weights.reduce((a,b)=>a+b,0);
  if(total<=0)return pool[pool.length-1];
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}

const BALL_HOME=[{cx:122,cy:162},{cx:168,cy:140},{cx:206,cy:168},{cx:134,cy:200},{cx:178,cy:202}];
const BALL_IDS=['mb1','mb2','mb3','mb4','mb5'];
const TEXT_IDS=['mbt1','mbt2','mbt3','mbt4','mbt5'];

function animateMachine(prize,cb){
  let t=0;
  const iv=setInterval(()=>{
    BALL_IDS.forEach((bid,i)=>{
      const el=document.getElementById(bid),tx=document.getElementById(TEXT_IDS[i]);
      const hx=BALL_HOME[i].cx,hy=BALL_HOME[i].cy;
      const nx=Math.max(55,Math.min(255,hx+(Math.random()-.5)*18));
      const ny=Math.max(55,Math.min(260,hy+(Math.random()-.5)*18));
      el.setAttribute('cx',nx);el.setAttribute('cy',ny);
      const shine=el.nextElementSibling;if(shine&&shine.tagName==='circle'){shine.setAttribute('cx',nx);shine.setAttribute('cy',ny)}
      tx.setAttribute('x',nx);tx.setAttribute('y',ny+5);
    });
    t++;
    if(t>24){
      clearInterval(iv);
      BALL_IDS.forEach((bid,i)=>{
        const el=document.getElementById(bid),tx=document.getElementById(TEXT_IDS[i]);
        el.setAttribute('cx',BALL_HOME[i].cx);el.setAttribute('cy',BALL_HOME[i].cy);
        const shine=el.nextElementSibling;if(shine&&shine.tagName==='circle'){shine.setAttribute('cx',BALL_HOME[i].cx);shine.setAttribute('cy',BALL_HOME[i].cy)}
        tx.setAttribute('x',BALL_HOME[i].cx);tx.setAttribute('y',BALL_HOME[i].cy+5);
      });
      launchBall(prize,cb);
    }
  },48);
}

function launchBall(prize,cb){
  const eb=document.getElementById('exitBall'),es=document.getElementById('exitShine');
  eb.setAttribute('fill',prize.color);eb.setAttribute('r','22');eb.setAttribute('opacity','1');eb.setAttribute('cx','155');eb.setAttribute('cy','255');
  es.setAttribute('r','22');es.setAttribute('opacity','0.6');es.setAttribute('cx','155');es.setAttribute('cy','255');
  let cy=255,t=0;
  const iv=setInterval(()=>{cy+=7;t++;eb.setAttribute('cy',cy);es.setAttribute('cy',cy);
    if(t>8){clearInterval(iv);eb.setAttribute('r','0');eb.setAttribute('opacity','0');es.setAttribute('r','0');es.setAttribute('opacity','0');
      showHtmlBall(prize,cb);
    }},38);
}

function showHtmlBall(prize,cb){
  const hb=document.getElementById('htmlBall');
  const label=prize.rank>0?prize.rank+'等':'参';
  hb.style.background=prize.color;
  hb.style.fontSize=prize.rank>0?'clamp(14px,4vw,17px)':'clamp(11px,3vw,13px)';
  hb.textContent=label;
  hb.style.opacity='1';hb.style.top='0';hb.style.transition='none';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      hb.style.transition='top 0.55s cubic-bezier(.25,1.4,.5,1), opacity 0.4s ease 0.5s';
      hb.style.top='24px';
      setTimeout(()=>{hb.style.opacity='0';setTimeout(()=>{hb.style.top='0';cb()},450)},600);
    });
  });
}

function playSound(rank){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(rank===1||rank===2){
      [[523,.0],[659,.14],[784,.28],[1047,.42],[1318,.56]].forEach(([f,d])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
        o.frequency.value=f;o.type='sine';
        g.gain.setValueAtTime(0,ctx.currentTime+d);g.gain.linearRampToValueAtTime(0.28,ctx.currentTime+d+0.05);g.gain.linearRampToValueAtTime(0,ctx.currentTime+d+0.22);
        o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+0.25);
      });
    }else if(rank===3||rank===4){
      [[523,.0],[659,.13],[784,.26]].forEach(([f,d])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
        o.frequency.value=f;o.type='sine';
        g.gain.setValueAtTime(0,ctx.currentTime+d);g.gain.linearRampToValueAtTime(0.22,ctx.currentTime+d+0.05);g.gain.linearRampToValueAtTime(0,ctx.currentTime+d+0.18);
        o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+0.2);
      });
    }
  }catch(e){}
}

function spawnConfetti(wrap,n){
  const cols=['#E24B4A','#EF9F27','#1D9E75','#378ADD','#ED93B1','#FAC775','#9FE1CB'];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='cf';
    const sz=6+Math.random()*9;
    d.style.cssText=`left:${Math.random()*100}%;top:-12px;width:${sz}px;height:${sz}px;background:${cols[~~(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${.9+Math.random()*1.2}s;animation-delay:${Math.random()*.5}s`;
    wrap.appendChild(d);
  }
  setTimeout(()=>wrap.innerHTML='',2800);
}

function showWin(prize){
  const ov=document.getElementById('winOverlay'),box=document.getElementById('winBox');
  const title=document.getElementById('winTitle'),pname=document.getElementById('winPrizeName');
  const msg=document.getElementById('winMsg'),btn=document.getElementById('winClose'),wrap=document.getElementById('cfWrap');
  wrap.innerHTML='';
  box.style.background=prize.bg;box.style.border='3px solid '+prize.color;
  btn.style.background=prize.color;btn.style.color='#fff';
  if(prize.rank===1){
    title.style.color=prize.tc;title.innerHTML='★ おめでとうございます！ ★';
    pname.style.color=prize.tc;pname.textContent=prize.name+' 当選！';
    msg.style.color=prize.tc;msg.innerHTML='<strong style="font-size:clamp(16px,5.5vw,22px)">最高賞を引き当てました！</strong><br>素晴らしい！おめでとうございます！';
    spawnConfetti(wrap,55);
  }else if(prize.rank===2){
    title.style.color=prize.tc;title.innerHTML='★ おめでとうございます！ ★';
    pname.style.color=prize.tc;pname.textContent=prize.name+' 当選！';
    msg.style.color=prize.tc;msg.innerHTML='<strong style="font-size:clamp(15px,5vw,20px)">大当たりです！</strong><br>ラッキーですね！おめでとうございます！';
    spawnConfetti(wrap,38);
  }else{
    title.style.color=prize.tc;title.textContent='おめでとうございます！';
    pname.style.color=prize.tc;pname.textContent=prize.name+' 当選！';
    msg.style.color=prize.tc;msg.textContent='またぜひご参加ください！';
    spawnConfetti(wrap,16);
  }
  ov.classList.add('open');
}
function closeWin(){document.getElementById('winOverlay').classList.remove('open')}

document.getElementById('spinBtn').addEventListener('click',()=>{
  if(ticketLeft<=0)return;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('resultArea').innerHTML='';
  const prize=pick();
  animateMachine(prize,()=>{
    if(prize.rank>0&&counts[prize.id]>0)counts[prize.id]--;
    if(prize.rank===0){partCnt++;totalPts+=prize.pts}
    ticketLeft--;spinCnt++;
    if(!wonMap[prize.id])wonMap[prize.id]={qty:0};
    wonMap[prize.id].qty++;
    document.getElementById('resultArea').innerHTML=`<div class="result-badge" style="background:${prize.bg};color:${prize.tc};border-color:${prize.color}">${prize.name}</div>`;
    document.getElementById('ticketBadge').textContent='残り '+ticketLeft+' 枚';
    document.getElementById('sTkt').textContent=ticketLeft;
    updateRemainDisplay();renderStats();renderLog();
    if(prize.rank>=1&&prize.rank<=4){playSound(prize.rank);setTimeout(()=>showWin(prize),350)}
    setTimeout(()=>{document.getElementById('spinBtn').disabled=ticketLeft<=0},500);
  });
});

document.getElementById('ticketInput').addEventListener('input',syncTicket);
document.getElementById('ticketInput').addEventListener('change',syncTicket);

document.getElementById('bannerArea').addEventListener('click',()=>{
  tapCount++;clearTimeout(tapTimer);
  if(tapCount>=10){tapCount=0;openSettings();return}
  tapTimer=setTimeout(()=>{tapCount=0},3000);
});

function openSettings(){
  const body=document.getElementById('settingsBody');
  const total=PRIZES.reduce((s,p)=>s+probs[p.id],0);
  body.innerHTML='<div style="font-size:11px;color:#854F0B;margin-bottom:10px">スライダー（1%刻み）で当選確率の重みを調整。本数は直接入力。</div>'+
  PRIZES.map(p=>{
    const pct=(total>0?(probs[p.id]/total*100):0).toFixed(1);
    return `<div class="ps-row"><div class="ps-top"><span class="ps-dot" style="background:${p.color}"></span><span class="ps-name">${p.name}</span></div><div class="ps-ctrls">${p.rank>0?`<span class="slbl">本数</span><input type="number" id="sc_${p.id}" min="0" max="9999" value="${counts[p.id]}"/>`:'<span style="font-size:11px;color:#888">無制限</span>'}<span class="slbl">確率</span><input type="range" min="0" max="100" step="1" value="${probs[p.id]}" id="sp_${p.id}" oninput="syncProb()"/><span class="ps-pct" id="spv_${p.id}">${pct}%</span></div></div>`;
  }).join('');
  document.getElementById('bsTtl').value=document.getElementById('bannerTtl').textContent;
  document.getElementById('bsSub').value=document.getElementById('bannerSub').textContent;
  const cc=document.getElementById('bsColors');cc.innerHTML='';
  BANNER_COLORS.forEach(c=>{
    const s=document.createElement('span');s.className='bs-color'+(c===bannerColor?' active':'');
    s.style.background=c;s.onclick=()=>{bannerColor=c;document.querySelectorAll('.bs-color').forEach(x=>x.classList.remove('active'));s.classList.add('active');applyBannerColor()};
    cc.appendChild(s);
  });
  document.getElementById('settingsOverlay').classList.add('open');
}

function syncProb(){
  const total=PRIZES.reduce((s,p)=>{const e=document.getElementById('sp_'+p.id);return s+(e?+e.value:probs[p.id])},0);
  PRIZES.forEach(p=>{const e=document.getElementById('sp_'+p.id),pv=document.getElementById('spv_'+p.id);if(e&&pv)pv.textContent=total>0?((+e.value/total)*100).toFixed(1)+'%':'0%'});
}

function applyBannerColor(){
  document.getElementById('bannerInner').style.background=`linear-gradient(135deg,${bannerColor} 0%,${bannerColor}cc 50%,${bannerColor} 100%)`;
}

function handleBannerFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{bannerImgData=e.target.result};
  reader.readAsDataURL(file);
}

function applySettings(){
  PRIZES.forEach(p=>{
    const pe=document.getElementById('sp_'+p.id);if(pe)probs[p.id]=+pe.value;
    const ce=document.getElementById('sc_'+p.id);if(ce)counts[p.id]=Math.max(0,parseInt(ce.value)||0);
  });
  const ttl=document.getElementById('bsTtl').value.trim();
  const sub=document.getElementById('bsSub').value.trim();
  if(ttl)document.getElementById('bannerTtl').textContent=ttl;
  if(sub)document.getElementById('bannerSub').textContent=sub;
  if(bannerImgData){
    const img=document.getElementById('bannerImg');
    img.src=bannerImgData;img.style.display='block';
    document.getElementById('bannerText').style.display='none';
  }
  applyBannerColor();
  renderRemain();renderStats();closeSettings();
}

function closeSettings(){document.getElementById('settingsOverlay').classList.remove('open')}

function doReset(){
  PRIZES.forEach(p=>{counts[p.id]=p.cnt;probs[p.id]=p.prob});
  wonMap={};spinCnt=0;totalPts=0;partCnt=0;tapCount=0;
  const v=parseInt(document.getElementById('ticketInput').value)||1;
  ticketLeft=v;
  document.getElementById('resultArea').innerHTML='';
  renderRemain();syncTicket();renderStats();renderLog();
}

init();
</script>
