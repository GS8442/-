
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.outer{background:#FFF9E6;min-height:100vh;padding:0;position:relative;overflow:hidden}
.bg-deco{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.content{position:relative;z-index:1;padding:10px 12px 28px}
.header-box{background:#E24B4A;border-radius:16px;padding:12px 16px 10px;text-align:center;margin-bottom:12px;cursor:pointer;user-select:none}
.header-box .ttl{font-size:22px;font-weight:500;color:#fff;letter-spacing:0.04em}
.header-box .sub{font-size:12px;color:#ffd6d6;margin-top:2px}
.remain-card{background:#fff;border-radius:14px;border:1.5px solid #FAC775;padding:10px 12px;margin-bottom:12px}
.remain-title{font-size:12px;font-weight:500;color:#854F0B;margin-bottom:8px}
.remain-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.remain-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:9px;border:1px solid #FAC775;background:#FFF9E6}
.rdot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.rname{font-size:12px;color:#3C2A00;flex:1;min-width:0;line-height:1.3}
.rnum{font-size:15px;font-weight:500;color:#E24B4A;min-width:28px;text-align:right}
.ticket-area{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ticket-area label{font-size:14px;font-weight:500;color:#3C2A00}
.ticket-area input[type=number]{width:70px;font-size:16px;font-weight:500;padding:6px 8px;border:1.5px solid #FAC775;border-radius:9px;background:#fff;color:#3C2A00;text-align:center}
.ticket-badge{font-size:13px;color:#854F0B;background:#FAEEDA;border-radius:20px;padding:3px 12px}
.spin-center{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px}
.machine-wrap{position:relative;width:240px;height:240px}
.machine-wrap svg{width:100%;height:100%}
#spinBtn{font-size:18px;font-weight:500;padding:14px 48px;border-radius:40px;border:none;background:#E24B4A;color:#fff;cursor:pointer;letter-spacing:0.08em;transition:transform 0.12s,opacity 0.15s}
#spinBtn:disabled{opacity:0.38;cursor:default}
#spinBtn:not(:disabled):hover{opacity:0.88}
#spinBtn:not(:disabled):active{transform:scale(0.96)}
.result-area{min-height:50px;display:flex;align-items:center;justify-content:center}
.rbadge{font-size:17px;font-weight:500;padding:8px 22px;border-radius:40px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.6,1) both}
@keyframes pop{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.stats-row2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sc{background:#fff;border-radius:10px;border:1.5px solid #FAC775;padding:7px 8px;text-align:center}
.sc-lbl{font-size:11px;color:#854F0B;margin-bottom:2px}
.sc-val{font-size:19px;font-weight:500;color:#3C2A00}

.sc-pt .sc-lbl{color:#5F5E5A}

.log-header span{font-size:13px;font-weight:500;color:#3C2A00}
.rbtn{font-size:12px;color:#854F0B;background:#FAEEDA;border:none;border-radius:6px;padding:3px 10px;cursor:pointer}

.settings-overlay{display:none;position:absolute;top:0;left:0;width:100%;min-height:100%;background:rgba(0,0,0,0.55);z-index:100;align-items:flex-start;justify-content:center;padding:20px 12px}

.settings-box{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:640px;margin:auto}
.settings-box h3{font-size:16px;font-weight:500;color:#3C2A00;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}

.prize-row-s{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px dashed #FAC775}
.prize-row-s:last-child{border-bottom:none}
.sdot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.sname{font-size:13px;font-weight:500;color:#3C2A00;flex:1;min-width:0}
.s-inputs{display:flex;align-items:center;gap:8px;flex-shrink:0}
.s-inputs input[type=number]{width:58px;font-size:13px;padding:3px 5px;border:1px solid #FAC775;border-radius:7px;background:#FFF9E6;color:#3C2A00;text-align:center}
.s-inputs input[type=range]{width:80px;accent-color:#E24B4A}
.prob-pct{font-size:12px;font-weight:500;color:#E24B4A;min-width:38px;text-align:right}
.slbl{font-size:11px;color:#854F0B}
.win-overlay{display:none;position:absolute;top:0;left:0;width:100%;min-height:100%;z-index:200;align-items:center;justify-content:center;background:rgba(0,0,0,0.6)}
.win-overlay.open{display:flex}
.win-box{border-radius:24px;padding:28px 20px;text-align:center;animation:popbig .5s cubic-bezier(.2,1.4,.6,1) both;max-width:320px;width:92%;position:relative}

.win-title{font-size:32px;font-weight:500;margin-bottom:6px}
.win-prize{font-size:20px;font-weight:500;margin-bottom:8px}
.win-close{font-size:14px;padding:9px 30px;border-radius:30px;border:none;cursor:pointer;margin-top:10px;font-weight:500}
.confetti-wrap{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;border-radius:24px}
.cf{position:absolute;width:10px;height:10px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(200px) rotate(720deg);opacity:0}}
</style>

<script>
const PRIZES=[
  {id:'p1',name:'1等：商品券3,000円',color:'#E24B4A',bg:'#FCEBEB',tc:'#A32D2D',cnt:10,prob:1,rank:1,pts:0},
  {id:'p2',name:'2等：お米 2kg',color:'#1D9E75',bg:'#E1F5EE',tc:'#085041',cnt:20,prob:2,rank:2,pts:0},
  {id:'p3',name:'3等：キッチンタオル4ロール',color:'#EF9F27',bg:'#FAEEDA',tc:'#633806',cnt:300,prob:25,rank:3,pts:0},
  {id:'p4',name:'4等：伊藤園むぎ茶650ml',color:'#378ADD',bg:'#E6F1FB',tc:'#0C447C',cnt:840,prob:55,rank:4,pts:0},
  {id:'p0',name:'参加賞：3ポイント',color:'#888780',bg:'#F1EFE8',tc:'#2C2C2A',cnt:99999,prob:17,rank:0,pts:3},
];
let counts={},probs={},ticketLeft=0,spinCnt=0,log=[],totalPts=0,participateCnt=0,tapCount=0,tapTimer=null;

function init(){
  PRIZES.forEach(p=>{counts[p.id]=p.cnt;probs[p.id]=p.prob});
  syncTicket();renderRemain();renderStats();renderLog();
}

function renderRemain(){
  const g=document.getElementById('remainGrid');
  g.innerHTML='';
  PRIZES.filter(p=>p.rank>0).forEach(p=>{
    const d=document.createElement('div');
    d.className='remain-item';
    d.innerHTML=`<span class="rdot" style="background:${p.color}"></span><span class="rname">${p.name}</span><span class="rnum" id="rn_${p.id}">${counts[p.id]}</span>`;
    g.appendChild(d);
  });
}

function updateRemainDisplay(){
  PRIZES.filter(p=>p.rank>0).forEach(p=>{
    const el=document.getElementById('rn_'+p.id);
    if(el)el.textContent=counts[p.id];
  });
}

function syncTicket(){
  const v=parseInt(document.getElementById('ticketInput').value)||1;
  ticketLeft=v;
  document.getElementById('ticketBadge').textContent='残り '+ticketLeft+' 枚';
  document.getElementById('sTkt').textContent=ticketLeft;
  document.getElementById('spinBtn').disabled=ticketLeft<=0;
}

function renderStats(){
  const tp=PRIZES.filter(p=>p.rank>0).reduce((s,p)=>s+Math.max(0,counts[p.id]),0);
  document.getElementById('sPrz').textContent=tp;
  document.getElementById('sCnt').textContent=spinCnt;
  document.getElementById('sParticipate').textContent=participateCnt;
  document.getElementById('sTotalPt').textContent=totalPts+' pt';
  document.getElementById('spinBtn').disabled=ticketLeft<=0;
}

function pick(){
  const pool=PRIZES.filter(p=>p.rank===0||(counts[p.id]>0));
  const weights=pool.map(p=>Math.max(0,probs[p.id]));
  const total=weights.reduce((a,b)=>a+b,0);
  if(total<=0)return pool[pool.length-1];
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}

const BALL_HOME=[{cx:98,cy:138},{cx:136,cy:118},{cx:168,cy:142},{cx:108,cy:170},{cx:152,cy:172}];
const BALL_IDS=['mb1','mb2','mb3','mb4','mb5'];

function animateMachine(prize,cb){
  let t=0;
  const iv=setInterval(()=>{
    BALL_IDS.forEach((id,i)=>{
      const el=document.getElementById(id),txt=document.getElementById('mbt'+(i+1));
      const hx=BALL_HOME[i].cx,hy=BALL_HOME[i].cy;
      const nx=Math.max(40,Math.min(220,hx+(Math.random()-.5)*14));
      const ny=Math.max(50,Math.min(215,hy+(Math.random()-.5)*14));
      el.setAttribute('cx',nx);el.setAttribute('cy',ny);
      txt.setAttribute('x',nx);txt.setAttribute('y',ny+5);
    });
    t++;
    if(t>22){
      clearInterval(iv);
      BALL_IDS.forEach((id,i)=>{
        const el=document.getElementById(id),txt=document.getElementById('mbt'+(i+1));
        el.setAttribute('cx',BALL_HOME[i].cx);el.setAttribute('cy',BALL_HOME[i].cy);
        txt.setAttribute('x',BALL_HOME[i].cx);txt.setAttribute('y',BALL_HOME[i].cy+5);
      });
      shootBall(prize,cb);
    }
  },50);
}

function shootBall(prize,cb){
  const eb=document.getElementById('exitBall');
  eb.setAttribute('fill',prize.color);eb.setAttribute('r','18');eb.setAttribute('opacity','1');
  let cy=215,t=0;
  const iv=setInterval(()=>{cy+=6;t++;eb.setAttribute('cy',cy);if(t>10){clearInterval(iv);eb.setAttribute('r','0');eb.setAttribute('opacity','0');eb.setAttribute('cy','215');cb()}},35);
}

function playSound(rank){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(rank===1||rank===2){
      [523,659,784,1047].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime+i*0.13);g.gain.linearRampToValueAtTime(0.3,ctx.currentTime+i*0.13+0.05);g.gain.linearRampToValueAtTime(0,ctx.currentTime+i*0.13+0.22);o.start(ctx.currentTime+i*0.13);o.stop(ctx.currentTime+i*0.13+0.25)});
    }else if(rank===3||rank===4){
      [523,659,784].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime+i*0.12);g.gain.linearRampToValueAtTime(0.25,ctx.currentTime+i*0.12+0.05);g.gain.linearRampToValueAtTime(0,ctx.currentTime+i*0.12+0.18);o.start(ctx.currentTime+i*0.12);o.stop(ctx.currentTime+i*0.12+0.2)});
    }
  }catch(e){}
}

function spawnConfetti(wrap,count){
  const cols=['#E24B4A','#EF9F27','#1D9E75','#378ADD','#ED93B1','#FAC775','#9FE1CB'];
  for(let i=0;i<count;i++){
    const d=document.createElement('div');d.className='cf';
    d.style.left=Math.random()*100+'%';d.style.top='-10px';
    d.style.background=cols[Math.floor(Math.random()*cols.length)];
    d.style.width=(7+Math.random()*8)+'px';d.style.height=(7+Math.random()*8)+'px';
    d.style.borderRadius=Math.random()>.5?'50%':'3px';
    d.style.animationDuration=(0.8+Math.random()*1.2)+'s';d.style.animationDelay=(Math.random()*0.5)+'s';
    wrap.appendChild(d);
  }
  setTimeout(()=>wrap.innerHTML='',2500);
}

function showWin(prize){
  const ov=document.getElementById('winOverlay'),box=document.getElementById('winBox');
  const title=document.getElementById('winTitle'),pname=document.getElementById('winPrizeName');
  const msg=document.getElementById('winMsg'),btn=document.getElementById('winClose'),wrap=document.getElementById('confettiWrap');
  wrap.innerHTML='';
  box.style.background=prize.bg;box.style.border='3px solid '+prize.color;
  btn.style.background=prize.color;btn.style.color='#fff';
  if(prize.rank===1){
    title.style.color=prize.tc;title.innerHTML='★ おめでとうございます！ ★';
    pname.style.color=prize.tc;pname.textContent=prize.name+' 当選！';
    msg.style.color=prize.tc;msg.innerHTML='<strong style="font-size:18px">最高賞を引き当てました！</strong><br>素晴らしい！おめでとうございます！';
    spawnConfetti(wrap,50);
  }else if(prize.rank===2){
    title.style.color=prize.tc;title.innerHTML='★ おめでとうございます！ ★';
    pname.style.color=prize.tc;pname.textContent=prize.name+' 当選！';
    msg.style.color=prize.tc;msg.innerHTML='<strong style="font-size:17px">大当たりです！</strong><br>ラッキーですね！おめでとうございます！';
    spawnConfetti(wrap,35);
  }else{
    title.style.color=prize.tc;title.textContent='おめでとうございます！';
    pname.style.color=prize.tc;pname.textContent=prize.name+' 当選！';
    msg.style.color=prize.tc;msg.textContent='またぜひご参加ください！';
    spawnConfetti(wrap,15);
  }
  ov.classList.add('open');
}

function closeWin(){document.getElementById('winOverlay').classList.remove('open')}

document.getElementById('spinBtn').addEventListener('click',()=>{
  if(ticketLeft<=0)return;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('resultArea').innerHTML='';
  const prize=pick();
  animateMachine(prize,()=>{
    if(prize.rank>0&&counts[prize.id]>0)counts[prize.id]--;
    if(prize.rank===0){participateCnt++;totalPts+=prize.pts}
    ticketLeft--;spinCnt++;
    log.unshift({n:spinCnt,prize});
    document.getElementById('resultArea').innerHTML=`<div class="rbadge" style="background:${prize.bg};color:${prize.tc};border:2px solid ${prize.color}88">${prize.name}</div>`;
    document.getElementById('ticketBadge').textContent='残り '+ticketLeft+' 枚';
    document.getElementById('sTkt').textContent=ticketLeft;
    updateRemainDisplay();renderStats();renderLog();
    if(prize.rank>=1&&prize.rank<=4){playSound(prize.rank);setTimeout(()=>showWin(prize),300)}
    setTimeout(()=>{document.getElementById('spinBtn').disabled=ticketLeft<=0},400);
  });
});

document.getElementById('ticketInput').addEventListener('input',syncTicket);
document.getElementById('ticketInput').addEventListener('change',syncTicket);

function renderLog(){
  const el=document.getElementById('logList');
  if(!log.length){el.innerHTML='<p class="empty">まだ抽選していません</p>';return}
  el.innerHTML=log.map(l=>`<div class="li"><span class="li-num">#${l.n}</span><span class="rdot" style="background:${l.prize.color};width:10px;height:10px;flex-shrink:0"></span><span>${l.prize.name}</span>${l.prize.rank===0?`<span class="li-pt">+${l.prize.pts} pt</span>`:''}</div>`).join('');
}

function doReset(){
  PRIZES.forEach(p=>{counts[p.id]=p.cnt;probs[p.id]=p.prob});
  log=[];spinCnt=0;totalPts=0;participateCnt=0;tapCount=0;
  const v=parseInt(document.getElementById('ticketInput').value)||1;
  ticketLeft=v;
  document.getElementById('resultArea').innerHTML='';
  renderRemain();syncTicket();renderStats();renderLog();
}

document.getElementById('headerTap').addEventListener('click',()=>{
  tapCount++;clearTimeout(tapTimer);
  if(tapCount>=10){tapCount=0;openSettings();return}
  tapTimer=setTimeout(()=>{tapCount=0},3000);
});

function openSettings(){
  const body=document.getElementById('settingsBody');
  const total=PRIZES.reduce((s,p)=>s+probs[p.id],0);
  body.innerHTML='<div style="font-size:11px;color:#854F0B;margin-bottom:10px">スライダーで当選確率の重みを調整。本数は直接入力で変更できます。</div>'+
  PRIZES.map(p=>`<div class="prize-row-s"><span class="sdot" style="background:${p.color}"></span><span class="sname">${p.name}</span><div class="s-inputs">${p.rank>0?`<span class="slbl">本数</span><input type="number" id="sc_${p.id}" min="0" max="9999" value="${counts[p.id]}" style="width:60px"/>`:'<span style="font-size:11px;color:#888">無制限</span>'}<span class="slbl">確率</span><input type="range" min="0" max="100" step="1" value="${probs[p.id]}" id="sp_${p.id}" oninput="syncProb()"/><span class="prob-pct" id="spv_${p.id}">${(probs[p.id]/total*100).toFixed(1)}%</span></div></div>`).join('');
  document.getElementById('settingsOverlay').classList.add('open');
}

function syncProb(){
  const total=PRIZES.reduce((s,p)=>{const el=document.getElementById('sp_'+p.id);return s+(el?+el.value:probs[p.id])},0);
  PRIZES.forEach(p=>{const el=document.getElementById('sp_'+p.id),pv=document.getElementById('spv_'+p.id);if(el&&pv)pv.textContent=total>0?((+el.value)/total*100).toFixed(1)+'%':'0%'});
}

function applySettings(){
  PRIZES.forEach(p=>{const pe=document.getElementById('sp_'+p.id);if(pe)probs[p.id]=+pe.value;const ce=document.getElementById('sc_'+p.id);if(ce)counts[p.id]=Math.max(0,parseInt(ce.value)||0)});
  renderRemain();renderStats();closeSettings();
}

function closeSettings(){document.getElementById('settingsOverlay').classList.remove('open')}

init();
</script>
